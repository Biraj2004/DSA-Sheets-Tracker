<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Core Technical SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://dsatracker.in/" />

    <!-- Title & Description (Targeting Primary Keywords, 50-60 & 150-160 chars) -->
    <title>DSA Sheets Tracker — Striver A2Z, NeetCode, Babbar 450</title>
    <meta
      name="description"
      content="Track, revise, and master 1,000+ curated DSA coding interview problems across Striver A2Z, NeetCode 150/250, and Babbar 450 sheets. 100% free and offline-ready."
    />
    <meta
      name="keywords"
      content="DSA sheet tracker, Striver A2Z sheet, NeetCode 150, Love Babbar 450, coding interview preparation, data structures and algorithms tracker, spaced repetition DSA"
    />
    <meta name="author" content="DSA Tracker" />

    <!-- Theme & Colors -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSA Tracker" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dsatracker.in/" />
    <meta property="og:site_name" content="DSA Sheets Tracker" />
    <meta property="og:title" content="DSA Sheets Tracker — Striver A2Z, NeetCode, Babbar 450" />
    <meta
      property="og:description"
      content="Track, revise, and master 1,000+ curated DSA coding interview problems across Striver A2Z, NeetCode 150/250, and Babbar 450 sheets. 100% free and offline-ready."
    />
    <meta property="og:image" content="https://dsatracker.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DSA Sheets Tracker preview interface displaying step-wise problem progress, difficulty tags, and spaced repetition schedule."
    />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dsatracker.in/" />
    <meta name="twitter:title" content="DSA Sheets Tracker — Striver A2Z, NeetCode, Babbar 450" />
    <meta
      name="twitter:description"
      content="Track, revise, and master 1,000+ curated DSA coding interview problems across Striver A2Z, NeetCode 150/250, and Babbar 450 sheets. 100% free and offline-ready."
    />
    <meta name="twitter:image" content="https://dsatracker.in/og-image.png" />

    <!-- Google Fonts Preconnect (Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD): WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DSA Sheets Tracker",
        "url": "https://dsatracker.in/",
        "description": "Systematic coding interview preparation tracker covering Striver A2Z, NeetCode 150/250, Love Babbar 450, and Apna College DSA sheets.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript and HTML5 support",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "1,020 unique canonical DSA problems",
          "Step-wise authentic topic arrangements",
          "Offline-first progress persistence with IndexedDB",
          "Spaced repetition revision scheduling",
          "Personal time and space complexity notes",
          "Cross-sheet deduplication and unified progress tracking"
        ]
      }
    </script>

    <!-- Structured Data (JSON-LD): FAQPage for AI Search & GEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Which DSA sheet should I start with for technical interviews?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For complete beginners to intermediate learners, the Striver A2Z DSA Sheet offers the most thorough step-by-step foundation across 455 problems. If you have limited time before interviews (under 2 months), NeetCode 150 provides high-yield pattern coverage across standard LeetCode categories."
            }
          },
          {
            "@type": "Question",
            "name": "Does DSA Sheets Tracker save progress offline without logging in?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. DSA Sheets Tracker utilizes browser IndexedDB storage (via Dexie.js). All solved problems, personal notes, star bookmarks, and revision schedules are saved instantly to your local machine, functioning 100% offline with zero data loss on page refresh."
            }
          },
          {
            "@type": "Question",
            "name": "Are duplicate problems counted multiple times across different sheets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. All 1,020 problems in DSA Sheets Tracker are deduplicated and mapped to canonical IDs. When you solve a problem like 'Two Sum' in Striver A2Z, it automatically reflects as solved across NeetCode and Love Babbar sheets without double-counting your mastery."
            }
          }
        ]
      }
    </script>

    <!-- Structured Data (JSON-LD): ItemList of Curated Sheets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Curated DSA Problem Sheets",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Striver A2Z DSA Sheet",
            "url": "https://dsatracker.in/sheet/striver-a2z"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Love Babbar 450 DSA Sheet",
            "url": "https://dsatracker.in/sheet/love-babbar-450"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "NeetCode 150 Sheet",
            "url": "https://dsatracker.in/sheet/neetcode-150"
          },
          {
            "@type": "ListItem",
            "position": 4,
            "name": "NeetCode 250 Sheet",
            "url": "https://dsatracker.in/sheet/neetcode-250"
          },
          {
            "@type": "ListItem",
            "position": 5,
            "name": "Apna College DSA Sheet",
            "url": "https://dsatracker.in/sheet/apna-college"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/20 selection:text-indigo-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
