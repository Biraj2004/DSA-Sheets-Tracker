    <!-- Structured Data (JSON-LD): WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DSA Sheets Tracker",
        "url": "https://dsa-sheets-tracker.newkid.workers.dev/",
        "description": "Systematic coding interview preparation tracker covering Striver A2Z, NeetCode 250, Love Babbar 450, Fraz, Namaste DSA, Apna College, and Pattern-Wise DSA sheets.",
        "applicationCategory": ["EducationalApplication", "DeveloperApplication"],
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript and HTML5 support",
        "author": {
          "@type": "Person",
          "name": "Biraj Sarkar",
          "url": "https://github.com/Biraj2004"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "1,003 unique canonical DSA problems",
          "7 curated interview sheets with cross-sheet deduplication",
          "Offline-first progress persistence with IndexedDB (Dexie.js)",
          "Spaced repetition revision scheduling with overdue alerts",
          "Personal time and space complexity notes",
          "Zero login and zero external tracking"
        ]
      }
    </script>

    <!-- Structured Data (JSON-LD): FAQPage for Search & GEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Which DSA sheet should I start with for technical interviews?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For complete beginners to intermediate learners, the Striver A2Z DSA Sheet offers the most thorough step-by-step foundation. If you have limited time before interviews (under 2 months), NeetCode 250 provides high-yield pattern coverage across standard coding interview categories."
            }
          },
          {
            "@type": "Question",
            "name": "Does DSA Sheets Tracker save progress offline without logging in?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. DSA Sheets Tracker utilizes browser IndexedDB storage via Dexie.js. All solved problems, personal notes, star bookmarks, and revision schedules are saved instantly to your local machine, functioning 100% offline with zero data loss."
            }
          },
          {
            "@type": "Question",
            "name": "Are duplicate problems counted multiple times across different sheets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. All 1,003 problems in DSA Sheets Tracker are deduplicated and mapped to canonical IDs. When you solve a problem like 'Two Sum' in Striver A2Z, it automatically reflects as solved across NeetCode and Love Babbar sheets without double-counting your mastery."
            }
          }
        ]
      }
    </script>
