<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="#0b0f19" stroke="#1e293b" stroke-width="3" />
  
  <!-- Ambient glow -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#ambientGlow)" />

  <!-- Code brackets -->
  <!-- Left Bracket < -->
  <path d="M 98 184 L 52 256 L 98 328" fill="none" stroke="#818cf8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 414 184 L 460 256 L 414 328" fill="none" stroke="#6366f1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Binary Tree Edges -->
  <!-- Traversal / alternate edges -->
  <line x1="256" y1="133" x2="179" y2="230" stroke="#334155" stroke-width="11" stroke-linecap="round" />
  <line x1="179" y1="230" x2="138" y2="328" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
  <line x1="179" y1="230" x2="210" y2="328" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
  <line x1="333" y1="230" x2="292" y2="328" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />

  <!-- Optimal Solved Path (Indigo -> Emerald) -->
  <line x1="256" y1="133" x2="333" y2="230" stroke="#6366f1" stroke-width="15" stroke-linecap="round" />
  <line x1="333" y1="230" x2="374" y2="328" stroke="#10b981" stroke-width="16" stroke-linecap="round" />

  <!-- Tree Nodes -->
  <!-- Subtree leaves -->
  <circle cx="138" cy="328" r="17" fill="#0f172a" stroke="#475569" stroke-width="3.5" />
  <circle cx="210" cy="328" r="17" fill="#0f172a" stroke="#475569" stroke-width="3.5" />
  <circle cx="292" cy="328" r="17" fill="#0f172a" stroke="#475569" stroke-width="3.5" />

  <!-- Intermediate left child -->
  <circle cx="179" cy="230" r="20" fill="#1e293b" stroke="#64748b" stroke-width="4.5" />

  <!-- Root Node -->
  <circle cx="256" cy="133" r="25" fill="#6366f1" stroke="#e0e7ff" stroke-width="5.5" />

  <!-- Right intermediate child (in-progress) -->
  <circle cx="333" cy="230" r="25" fill="#4f46e5" stroke="#a5b4fc" stroke-width="5.5" />

  <!-- Solved Target Leaf (Emerald Checkmark) -->
  <circle cx="374" cy="328" r="30" fill="#10b981" stroke="#d1fae5" stroke-width="6.5" />
  <path d="M 361 327 L 371 337 L 387 318" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>